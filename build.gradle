plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.3'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.example'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // Web + REST
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // JPA/Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Миграции БД
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    // JDBC-драйвер PostgreSQL (нужен на runtime)
    runtimeOnly 'org.postgresql:postgresql'

    // === AWS SDK v2 (для S3Config и т.п.) ===
    implementation platform('software.amazon.awssdk:bom:2.25.35')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sts'
    implementation 'software.amazon.awssdk:auth'

    // Тесты
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// Собираем исполняемый JAR с именем app.jar (для Docker)
bootJar {
    archiveFileName = 'app.jar'
}

// Обычный jar нам не нужен
jar {
    enabled = false
}
