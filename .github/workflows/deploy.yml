name: deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  id-token: write        # для OIDC
  contents: read

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  oidc-probe:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::960682159316:role/praxe-gha-oidc
          aws-region: ${{ env.AWS_REGION }}
      - name: Who am I on AWS?
        run: aws sts get-caller-identity

  ecr-build-push:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: oidc-probe
    runs-on: ubuntu-latest
    env:
      AWS_REGION: eu-central-1
      ECR_REPO: praxe-demo
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::960682159316:role/praxe-gha-oidc
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository
        shell: bash
        run: |
          aws ecr describe-repositories --repository-names "${ECR_REPO}" >/dev/null 2>&1 || \
          aws ecr create-repository --repository-name "${ECR_REPO}" >/dev/null

      - id: ecr
        name: Login to ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & push image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          IMAGE="${REGISTRY}/${ECR_REPO}:${GITHUB_SHA}"
          echo "IMAGE=$IMAGE" >> $GITHUB_ENV
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Summary
        run: |
          echo "IMAGE=$IMAGE" | tee -a $GITHUB_STEP_SUMMARY
